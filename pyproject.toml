# 설치 선언 — fcc-test-contracts 레인
#
# 이 파일은 모노레포에서 리뷰되고, 추출 패키저가 납품 상자의 **루트**로 옮겨 싣는다
# (매니페스트 entry `kind: packaging_manifest`, future_path = "pyproject.toml").
# 운영자 판정 2026-08-15 안 B: 버전·의존은 스크립트가 만드는 리터럴이 아니라
# 저장소에 남는 결정이어야 한다.
#
# ⚠️ 이 파일의 모든 값은 파생이다. 발명한 값이 없다는 것이 봉인 대상이고
#    tests/test_repo_split_packaging_axis.py 가 각 줄의 출처를 대조한다.

[build-system]
# setuptools 62.5.0 릴리스 노트: "The [project] configuration interface in
# pyproject.toml is now fully supported." (공식 history) — [tool.setuptools]
# 하위 테이블(packages.find)을 함께 쓰므로 그 이전 버전은 성립하지 않는다.
requires = ["setuptools>=62.5"]
build-backend = "setuptools.build_meta"

[project]
# name = 매니페스트 `repositories` 의 레인 키. package_names 의
# `fcc_test_contracts` 는 **import 패키지 이름**이지 distribution 이름이 아니다.
name = "fcc-test-contracts"
# version = 이 레인이 이미 소유한 npm 배포물 packages/api-artifacts/package.json
# 과 상등. src/_version.py 는 fcc-unlicensed-headless 소유(GUI 앱 버전)라
# 두 레인의 배포를 GUI 릴리스에 묶게 되므로 쓰지 않는다.
#
# ⚠️ **「상등」은 2026-09-04 현재 거짓이고 그것을 재는 검사가 0건이다** — 이 값은
# `0.1.13`, npm 쪽은 `0.1.4` 다. 이번 판올림에서 npm 을 끌어올려 맞추지 **않았다**:
# 그러면 둘이 보조를 맞춰 온 것처럼 보이게 되고, 갈라진 사실 자체가 사라진다.
# 위 문장은 지금 산문 주장이지 게이트가 아니다. 소유 웨이브 미정.
# ⚠️ **0.1.19 를 건너뛴 것이 아니라 그 번호가 이미 쓰였다** (2026-09-05).
# PR #28 과 #29 가 **각자 독립적으로** 0.1.18 → 0.1.19 로 올렸다. 두 브랜치가 같은
# 줄을 썼으므로 git 이 깨끗이 병합했고 **아무 게이트도 붉지 않았다** — 버전 충돌은
# 병합 충돌과 모양이 다르다. 먼저 머지된 #29 가 `v0.1.19` 를 자기 머지 커밋에 붙여
# push 했고, 그래서 그 태그에는 #28 이 들어 있지 않다. 소비 레인이 `v0.1.19` 로 pin
# 하면 공급 폐포 판정기가 **오지 않는다**.
#
# 태그를 옮기지 않는다(이미 소비된 이름을 다시 겨누는 것은 더 나쁘다). 번호를 올려
# 「지금 main 이 가진 것」에 이름을 준다.
#
# 0.1.20  공급 폐포 판정기 · 추출 도구 도달성 · 릴리스 번호 게이트 (태그 있음)
# 0.1.21  extraction_package 의 고아 문자열 블록을 모듈 docstring 으로 흡수. 아직
#         태그가 없다 — 소비 레인이 이것을 필요로 하지 않는다(문서 변경). 다음에
#         이 레인이 태그를 낼 때 이 번호가 나간다.
# 0.1.22  적합성의 feature 축(§6.7 구현) · 측정 job 을 불투명 핸들로 주소 지정 ·
#         진입점이 자기 트리를 올리는지 실행으로 확인. ⚠️ **wire 파손을 담는다** —
#         소비 레인은 이 번호로 pin 하기 전에 두 축을 함께 옮겨야 한다
#         (생성 축 `job_id`→`generation_job_id`, 측정 축 `{job_id}`→`{job_uuid}`).
version = "0.1.23"
description = "Dependency-free shared web-boundary kernel: provider API DTOs, the route/operation/schema contract, the compatibility checker, and the HTTP-boundary primitives three lanes share."
# requires-python = infra/central/Dockerfile.api 의 런타임 베이스 이미지
# (`FROM python:3.11-slim`)에서 파생.
requires-python = ">=3.11"
# 이 레인은 서드파티 하드 의존이 0 이다. 매니페스트가 그것을 P0 로 선언하고
# (`forbidden_external` 7종 + `optional_external` 은 함수 내부 lazy + ImportError
# 가드만 허용) 별도 인터프리터 실행으로 판정한다. 실측: 상자의 런타임 코드에
# 모듈 레벨 서드파티 import 0건.
dependencies = []

[project.optional-dependencies]
# 매니페스트 `optional_external` 에서 파생. jwt 는 oidc_principal_resolver 가
# auth_mode=oidc_jwt 배포에서만 함수 안에서 lazy import 하므로, 이것이 없어도
# 패키지는 설치되고 import 된다. 하한은 requirements-central.txt SSOT.
oidc = ["PyJWT[crypto]>=2.8.0"]
# 상자가 자기 suite 를 싣는다(매니페스트 `lane_test_suite`). 하한은
# requirements.txt:33 SSOT. 이 레인의 테스트는 서드파티를 더 쓰지 않는다(실측).
# 라이브 PostgreSQL 증명(`tests/test_local_identity_live_postgres.py`)만 쓰는 것.
# 그 파일은 DSN 이 없으면 사유를 출력하고 skip 하므로 기본 CI 는 이것을 설치하지 않는다.
# 그래도 선언은 있어야 한다 — 선언하지 않으면 「DSN 을 넣고 돌려보니 죽더라」가 유일한
# 발견 경로가 되고, 그 발견은 증명하려던 그 순간에 온다.
# ⚠️ 실측 2026-09-04: `psycopg` 를 가드 없이 부르는데 어느 extra 에도 없었다. 같은 계급의
# 결함을 소비 레인(fcc-test-platform)에서 `tests/test_supply_closure_axis.py` 가 잡는다.
live-postgres = ["psycopg[binary]>=3.1"]

test = ["pytest>=7.0.0",
    # tests/test_auth_mode_local_jwt.py imports jwt without a guard, so
    # the test extra must carry what that import needs. Self-referencing
    # the oidc extra keeps ONE floor rather than a second copy here.
    "fcc-test-contracts[oidc]",
]

[tool.setuptools.packages.find]
# 상자의 최상위 import 패키지 하나. artifacts/ · packages/ · scripts/ · tests/ 는
# 배포 대상이 아니다 — 특히 scripts/ 는 상자에 `__init__.py` 가 **의도적으로 없고**
# 그 사실이 다른 곳에서 load-bearing 이다(contract_cli.sibling_module, 실행 축의
# PYTHONPATH 파생). 휠에 담으려면 손으로 유지하는 py-modules 목록이 필요하고
# 그것이 SPLIT-1 이 갚은 함정이므로 담지 않는다.
include = ["fcc_test_contracts*"]
# 실측: 상자의 fcc_test_contracts/ 에 `__init__.py` 가 없다(PEP 420 암묵
# 네임스페이스). setuptools 기본값도 true 지만, 그 트리 모양이 이 선언이 성립하는
# 근거이므로 명시한다 — 상자에 `__init__.py` 를 새로 넣는 것은 트리 모양 변경이고
# 레이아웃 기록·소유권·entry_point_roots 를 함께 건드린다.
namespaces = true

[tool.setuptools.package-data]
# ⚠️ 휠은 **임포트 가능한 패키지만** 싣는다. 이 레인이 배포하는 계약 아티팩트가
#    상자 루트 `artifacts/` 에 있던 동안, 이 레인을 **요구사항으로 설치한** 소비자는
#    그 파일들에 원리적으로 닿을 수 없었다 — 2026-08-31 실측으로 플랫폼 CI 실패
#    42건 중 33건이 정확히 그 거부(`DependencyTreeUnavailable`)였다. 그래서
#    아티팩트의 착지지를 패키지 **안**으로 옮기고(매니페스트가 SSOT) 여기서 싣는다.
#    `.extraction-layout.json` 도 함께 실어야 한다 — 그 기록이 없으면 설치된 레인은
#    자기가 무엇을 어디로 옮겼는지 말할 수 없고, 소비자는 규약으로 추측하게 된다.
"fcc_test_contracts" = [".extraction-layout.package.json"]
"fcc_test_contracts.artifacts" = ["*.json", "*.md"]

# ⚠️ 사본이다 — TOML 에는 include 가 없다. 그래서 루트 pyproject.toml 의
#    testpaths/markers/addopts 와 **상등 파리티 게이트**를 함께 세운다
#    (tests/test_repo_split_packaging_axis.py). 이 저장소의 표준 답:
#    강제된 사본에는 파리티 게이트를 단다.
#
#    세 키를 부분집합으로 옮기지 않는 이유: 이 축이 묻는 것은 "상자를 받은 팀이
#    **우리와 같은** 게이트를 돌 수 있는가"이고, 다른 pytest 설정으로 도는 상자는
#    우리 게이트를 도는 것이 아니다. addopts 의 `-p no:faulthandler` 가 provider
#    쪽 사유(Windows/Python 3.13 OOXML)에서 왔더라도 같이 간다.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 순수 단위 테스트 (하드웨어/네트워크/실제 파일 불필요)",
    "integration: 통합 테스트 (tempfile, 실제 Excel I/O 사용)",
    "hardware: 하드웨어 필수 (스펙트럼 분석기, Appium, Android)",
    "database: DB 통합 테스트 (SQLite, 실제 파일 I/O)",
    "bench: 정량 latency budget 측정 (GC-sensitive, 권장 단독 실행 — pytest -m bench)",
    "gui: 실제 QApplication/위젯을 만들고 Qt 이벤트 루프를 펌프하는 PySide6 테스트 (전체 회귀의 누적 네이티브 압박 하에서 access violation 크래시 → 단독 실행 -m gui)",
    "invariant: architecture/hygiene/SSOT/contract-drift 가드 (dataclass/AST/파일시스템/frontmatter 검사 — 장비 불필요). ubuntu CI 경량 게이트 대상 (conftest _INVARIANT_FILENAME_TOKENS SSOT 자동 부착).",
]
# Disable pytest's faulthandler plugin on Windows/Python 3.13 because it emits
# handled first-chance "Windows fatal exception: access violation" diagnostics
# during Office Open XML ZIP/XML tests even when the process exits successfully.
# Real failures still surface through non-zero exits and assertions.
addopts = "--strict-markers -p no:faulthandler"
